apiVersion: pkg.crossplane.io/v1beta1
kind: Function
metadata:
  name: function-patch-and-transform
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.8.2

---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: aws-postgresql
  labels:
    provider: aws
    db: postgresql
spec:
  compositeTypeRef:
    apiVersion: devopstoolkitseries.com/v1alpha1
    kind: SQL
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources   
        resources:
        - name: vpc
          base:
            apiVersion: ec2.aws.upbound.io/v1beta1
            kind: VPC
            spec:
              forProvider:
                region: us-east-1
                cidrBlock: 11.0.0.0/16
                enableDnsSupport: true
                enableDnsHostnames: true
        - name: subnet-a
          base:
            apiVersion: ec2.aws.upbound.io/v1beta1
            kind: Subnet
            metadata:
              labels:
                zone: us-east-1a
            spec:
              forProvider:
                region: us-east-1
                availabilityZone: us-east-1a
                cidrBlock: 11.0.0.0/24
                vpcIdSelector:
                  matchLabels:
                    crossplane.io/composite: silly-demo-db-9w8xd
        - name: subnet-b
          base:
            apiVersion: ec2.aws.upbound.io/v1beta1
            kind: Subnet
            metadata:
              labels:
                zone: us-east-1b
            spec:
              forProvider:
                region: us-east-1
                availabilityZone: us-east-1b
                cidrBlock: 11.0.1.0/24
                vpcIdSelector:
                  matchLabels:
                    crossplane.io/composite: silly-demo-db-9w8xd
        - name: subnet-c
          base:
            apiVersion: ec2.aws.upbound.io/v1beta1
            kind: Subnet
            metadata:
              labels:
                zone: us-east-1c
            spec:
              forProvider:
                region: us-east-1
                availabilityZone: us-east-1c
                cidrBlock: 11.0.2.0/24
                vpcIdSelector:
                  matchLabels:
                    crossplane.io/composite: silly-demo-db-9w8xd
        - name: subnetgroup
          base:
            apiVersion: rds.aws.upbound.io/v1beta1
            kind: SubnetGroup
            spec:
              forProvider:
                region: us-east-1
                description: I'm too lazy to write a good description
                subnetIdSelector:
                  matchLabels:
                    crossplane.io/composite: silly-demo-db-9w8xd
        - name: gateway
          base:
            apiVersion: ec2.aws.upbound.io/v1beta1
            kind: InternetGateway
            spec:
              forProvider:
                region: us-east-1
                vpcIdSelector:
                  matchLabels:
                    crossplane.io/composite: silly-demo-db-9w8xd
        - name: routeTable
          base:
            apiVersion: ec2.aws.upbound.io/v1beta1
            kind: RouteTable
            spec:
              forProvider:
                region: us-east-1
                vpcIdSelector:
                  matchLabels:
                    crossplane.io/composite: silly-demo-db-9w8xd
        - name: route
          base:
            apiVersion: ec2.aws.upbound.io/v1beta1
            kind: Route
            spec:
              forProvider:
                region: us-east-1
                routeTableIdSelector:
                  matchLabels:
                    crossplane.io/composite: silly-demo-db-9w8xd
                destinationCidrBlock: 0.0.0.0/0
                gatewayIdSelector:
                  matchLabels:
                    crossplane.io/composite: silly-demo-db-9w8xd
        - name: mainRouteTableAssociation
          base:
            apiVersion: ec2.aws.upbound.io/v1beta1
            kind: MainRouteTableAssociation
            spec:
              forProvider:
                region: us-east-1
                routeTableIdSelector:
                  matchLabels:
                    crossplane.io/composite: silly-demo-db-9w8xd
                vpcIdSelector:
                  matchLabels:
                    crossplane.io/composite: silly-demo-db-9w8xd
        - name: routeTableAssociation1a
          base:
            apiVersion: ec2.aws.upbound.io/v1beta1
            kind: RouteTableAssociation
            spec:
              forProvider:
                region: us-east-1
                routeTableIdSelector:
                  matchLabels:
                    crossplane.io/composite: silly-demo-db-9w8xd
                subnetIdSelector:
                  matchLabels:
                    crossplane.io/composite: silly-demo-db-9w8xd
        - name: routeTableAssociation1b
          base:
            apiVersion: ec2.aws.upbound.io/v1beta1
            kind: RouteTableAssociation
            spec:
              forProvider:
                region: us-east-1
                routeTableIdSelector:
                  matchLabels:
                    crossplane.io/composite: silly-demo-db-9w8xd
                subnetIdSelector:
                  matchLabels:
                    crossplane.io/composite: silly-demo-db-9w8xd
        - name: routeTableAssociation1c
          base:
            apiVersion: ec2.aws.upbound.io/v1beta1
            kind: RouteTableAssociation
            spec:
              forProvider:
                region: us-east-1
                routeTableIdSelector:
                  matchLabels:
                    crossplane.io/composite: silly-demo-db-9w8xd
                subnetIdSelector:
                  matchLabels:
                    crossplane.io/composite: silly-demo-db-9w8xd
        - name: securityGroup
          base:
            apiVersion: ec2.aws.upbound.io/v1beta1
            kind: SecurityGroup
            spec:
              forProvider:
                description: I am too lazy to write descriptions
                region: us-east-1
                vpcIdSelector:
                  matchLabels:
                    crossplane.io/composite: silly-demo-db-9w8xd
        - name: securityGroupRule
          base:
            apiVersion: ec2.aws.upbound.io/v1beta1
            kind: SecurityGroupRule
            spec:
              forProvider:
                description: I am too lazy to write descriptions
                region: us-east-1
                type: ingress
                fromPort: 5432
                toPort: 5432
                protocol: tcp
                cidrBlocks:
                  - 0.0.0.0/0
                securityGroupIdSelector:
                  matchLabels:
                    crossplane.io/composite: silly-demo-db-9w8xd
        - name: rdsinstance
          base:
            apiVersion: rds.aws.upbound.io/v1beta1
            kind: Instance
            spec:
              forProvider:
                region: us-east-1
                dbSubnetGroupNameSelector:
                  matchLabels:
                    crossplane.io/composite: silly-demo-db-9w8xd
                vpcSecurityGroupIdSelector:
                  matchLabels:
                    crossplane.io/composite: silly-demo-db-9w8xd
                instanceClass: db.t4g.micro
                username: masteruser
                engine: postgres
                engineVersion: "17.5"
                skipFinalSnapshot: true
                publiclyAccessible: true
                allocatedStorage: 50
                passwordSecretRef:
                  namespace: crossplane-system
                  key: password
                  name: silly-demo-db-password
